steps :
  - name : 'gcr.io/cloud-builders/gcloud'
    args :
      - 'builds'
      - 'submit'
      - '--tag=gcr.io/debaiter-478318/backend'
      - '--substitutions=_DIR=src/backend'

  - name : 'gcr.io/cloud-builders/gcloud'
    args : 
    - 'run'
    - 'deploy'
    - 'backend'
    - '--image=gcr.io/debaiter-478318/backend'
    - '--platform=managed'
    - '--region=us-central-1'
    - '--allow-unauthenticated'
images : 
  - 'gcr.io/debaiter-478318/backend'

options :
  logging : CLOUD_LOGGING_ONLY
